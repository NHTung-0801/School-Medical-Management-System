<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="${isEdit} ? 'Chỉnh Sửa Học Sinh | School Medical' : 'Thêm Học Sinh Mới | School Medical'">Học sinh</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/assets/css/fragments/header.css}" type="text/css"/>
  <link rel="stylesheet" th:href="@{/assets/css/fragments/footer.css}" type="text/css"/>
  <link rel="stylesheet" th:href="@{/assets/css/manager/student_form.css}">
</head>
<body>
<div th:replace="fragments/header :: Header"></div>
<div th:replace="fragments/header :: Nav-Manager"></div>

<main class="form-wrapper">
  <div class="form-container">
    <div class="form-header">
      <h2 class="form-title">
        <i th:class="${isEdit} ? 'fas fa-user-edit' : 'fas fa-user-plus'"></i>
        <span th:text="${isEdit} ? 'Chỉnh sửa thông tin học sinh' : 'Thêm học sinh mới'">Thêm học sinh mới</span>
      </h2>
      <p class="form-subtitle">
        <span th:text="${isEdit} ? 'Cập nhật thông tin chi tiết và phụ huynh của học sinh' : 'Điền thông tin để đăng ký học sinh mới vào hệ thống'">Điền thông tin học sinh</span>
      </p>
    </div>

    <!-- Thông báo lỗi nếu có -->
    <div th:if="${error}" class="error-alert">
      <i class="fas fa-exclamation-circle"></i> <span th:text="${error}"></span>
    </div>

    <form th:action="${isEdit} ? @{'/manager/students/update/' + ${student.id}} : @{/manager/students/create}" method="post" id="studentForm">
      <div class="form-group">
        <label for="fullName"><i class="fas fa-signature"></i> Họ tên học sinh:</label>
        <input type="text" id="fullName" name="fullName" th:value="${student != null ? student.fullName : ''}" placeholder="Nhập đầy đủ họ và tên học sinh" required>
      </div>

      <div class="form-row">
        <div class="form-group half">
          <label for="gender"><i class="fas fa-venus-mars"></i> Giới tính:</label>
          <select id="gender" name="gender" required>
            <option value="MALE" th:selected="${student != null && student.gender != null && student.gender.name() == 'MALE'}">Nam</option>
            <option value="FEMALE" th:selected="${student != null && student.gender != null && student.gender.name() == 'FEMALE'}">Nữ</option>
            <option value="OTHER" th:selected="${student != null && student.gender != null && student.gender.name() == 'OTHER'}">Khác</option>
          </select>
        </div>

        <div class="form-group half">
          <label for="birthDate"><i class="fas fa-calendar-alt"></i> Ngày sinh:</label>
          <input type="date" id="birthDate" name="birthDate" th:value="${student != null ? student.birthDate : ''}" required
                 th:attr="max=${#dates.format(#dates.createNow(), 'yyyy-MM-dd')}"/>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group half">
          <label for="className"><i class="fas fa-chalkboard"></i> Lớp học:</label>
          <input type="text" id="className" name="className" th:value="${student != null ? student.className : ''}" placeholder="VD: 3A, 4B, 12A1" required>
        </div>

        <div class="form-group half">
          <label for="address"><i class="fas fa-map-marker-alt"></i> Địa chỉ nơi ở:</label>
          <input type="text" id="address" name="address" th:value="${student != null ? student.address : ''}" placeholder="Nhập địa chỉ cư trú" required>
        </div>
      </div>

      <div class="form-group">
        <label for="parentId"><i class="fas fa-user-friends"></i> Phụ huynh phụ trách:</label>
        <select id="parentId" name="parentId" required>
          <option value="">-- Chọn phụ huynh (Số điện thoại) --</option>
          <option th:each="parent : ${parentList}"
                  th:value="${parent.id}"
                  th:selected="${student != null && student.parent != null && student.parent.id == parent.id}"
                  th:text="${(parent.fullName != null && !parent.fullName.isBlank() ? parent.fullName : 'Phụ huynh') + ' (SĐT: ' + (parent.user != null ? parent.user.username : parent.phoneNumber) + ')'}">
          </option>
        </select>
      </div>

      <div class="form-buttons">
        <button type="submit" class="btn-primary">
          <i th:class="${isEdit} ? 'fas fa-save' : 'fas fa-plus-circle'"></i>
          <span th:text="${isEdit} ? 'Lưu thay đổi' : 'Tạo học sinh'">Tạo học sinh</span>
        </button>
        <a th:href="@{/manager/students/list}" class="btn-secondary">
          <i class="fas fa-times"></i> Hủy
        </a>
      </div>
    </form>
  </div>
</main>

<script th:src="@{/assets/js/fragments/header.js}"></script>
<div th:replace="fragments/footer :: footer-compact"></div>
</body>
</html>
