<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Danh sách hồ sơ sức khỏe</title>

    <!-- Bootstrap + FontAwesome -->
    <link rel="stylesheet" th:href="@{https://cdn.jsdelivr.net/npm/bootstrap/5.3.0/dist/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css}">

    <!-- CSS chung -->
    <link rel="stylesheet" th:href="@{/assets/css/fragments/header.css}" type="text/css"/>
    <link rel="stylesheet" th:href="@{/assets/css/fragments/footer.css}" type="text/css"/>

    <!-- CSS tuỳ chỉnh -->
    <link rel="stylesheet" th:href="@{/assets/css/nurse/health-record/health_record_list.css}">
</head>
<body>

<!-- Header + Nav -->
<div th:replace="~{fragments/header :: Header}"></div>
<div th:replace="~{fragments/header :: Nav-Nurse}"></div>

<!-- Thông báo -->
<div class="alert-container position-relative">
    <p th:if="${success}" th:text="${success}" class="alert alert-success position-absolute top-0 end-0 me-2 mt-2 rounded-pill px-4 py-2 fw-semibold"></p>
    <p th:if="${error}" th:text="${error}" class="alert alert-danger position-absolute top-0 end-0 me-2 mt-2 rounded-pill px-4 py-2 fw-semibold"></p>
</div>

<!-- Nội dung chính -->
<main class="container py-4">
    <div class="medical-card">
        <!-- Executive Header Banner -->
        <div class="card-header-banner">
            <div class="banner-title-group">
                <div class="header-icon-badge">
                    <i class="fas fa-notes-medical"></i>
                </div>
                <div>
                    <h2 class="banner-title">Hồ Sơ Sức Khỏe Học Sinh</h2>
                    <p class="banner-subtitle">Theo dõi tiền sử bệnh lý, tình trạng dị ứng và chỉ số phát triển thể lực</p>
                </div>
            </div>

            <!-- Toolbar Tìm kiếm -->
            <form th:action="@{/nurse/health-record}" method="get" class="search-box">
                <input type="text" name="keyword" id="searchInput" class="form-control" placeholder="Tìm theo tên học sinh…" th:value="${keyword}">
                <i class="fas fa-search"></i>
            </form>
        </div>

        <!-- Bảng danh sách hồ sơ -->
        <div class="table-responsive">
            <table class="table table-bordered align-middle text-center table-rounded">
                <thead>
                <tr>
                    <th style="width: 60px;">STT</th>
                    <th>Họ tên học sinh</th>
                    <th style="width: 100px;">Lớp</th>
                    <th>Dị ứng</th>
                    <th>Bệnh mãn tính</th>
                    <th style="width: 150px;">Chi tiết</th>
                </tr>
                </thead>
                <tbody id="recordTable">
                <tr th:each="record, stat : ${records}">
                    <td th:text="${stat.index + 1}">1</td>
                    <td class="fw-semibold text-start ps-3" th:text="${record.student.fullName}">Nguyễn Văn A</td>
                    <td>
                        <span class="badge-class" th:text="${record.student.className}">10A1</span>
                    </td>
                    <td class="ellipsis-cell" th:title="${record.allergies}">
                        <span th:if="${record.allergies != null and record.allergies != '' and record.allergies != 'Không có'}" class="badge-warn" th:text="${record.allergies}">Dị ứng</span>
                        <span th:if="${record.allergies == null or record.allergies == '' or record.allergies == 'Không có'}" class="badge-safe">Không có</span>
                    </td>
                    <td class="ellipsis-cell" th:title="${record.chronicDisease}">
                        <span th:if="${record.chronicDisease != null and record.chronicDisease != '' and record.chronicDisease != 'Không có'}" class="badge-warn" th:text="${record.chronicDisease}">Bệnh mãn tính</span>
                        <span th:if="${record.chronicDisease == null or record.chronicDisease == '' or record.chronicDisease == 'Không có'}" class="badge-safe">Không có</span>
                    </td>
                    <td>
                        <a th:href="@{'/nurse/health-record/view/' + ${record.id}}" class="btn-action-view">
                            <i class="fas fa-eye"></i> Xem chi tiết
                        </a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(records)}">
                    <td colspan="6" class="text-center text-muted py-4 fst-italic">Không tìm thấy hồ sơ nào.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>

<!-- JS -->
<script th:src="@{/assets/js/nurse/health-record/health_record_list.js}"></script>
<script th:src="@{/assets/js/fragments/header.js}"></script>
<div th:replace="fragments/footer :: footer-compact"></div>
</body>
</html>
