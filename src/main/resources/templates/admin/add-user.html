<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/admin/edit-user.css}"/>
    <link rel="stylesheet" th:href="@{/assets/css/fragments/header.css}" type="text/css"/>
    <link rel="stylesheet" th:href="@{/assets/css/fragments/footer.css}" type="text/css"/>
    <title>Quản Lý Người Dùng</title>
</head>
<body>
<div th:replace="fragments/header :: Header"></div>
<div th:replace="fragments/header :: Nav-Admin"></div>
<div class="container">
    <h2>Thêm người dùng</h2>

    <form th:action="@{/admin/add-user}" th:object="${user}" method="post">
        <div class="form-group">
            <label for="username"><i class="fas fa-phone"></i> Số điện thoại đăng nhập:</label>
            <input type="tel" th:field="*{username}" id="username" placeholder="Nhập số điện thoại cấp cho phụ huynh (VD: 0912345678)" maxlength="10" required />
            <small id="phoneHint" class="field-hint" style="color: #64748b; font-size: 12px; display: block; margin-top: 4px;"><i class="fas fa-info-circle"></i> Số điện thoại dùng làm tài khoản đăng nhập (10 chữ số: 03, 05, 07, 08, 09).</small>
            <p th:if="${#fields.hasErrors('username')}" th:errors="*{username}" style="color: red; font-size: 13px; margin-top: 4px;"></p>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" th:field="*{email}" id="email" placeholder="Nhập email" required>
            <p th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: red; font-size: 13px; margin-top: 4px;"></p>
        </div>

        <div class="form-group">
            <label for="password">Mật khẩu:</label>
            <input type="password" th:field="*{password}" id="password" placeholder="Nhập mật khẩu" required />
            <i class="fas fa-eye toggle-password" id="togglePassword"></i>
            <p th:if="${#fields.hasErrors('password')}" th:errors="*{password}" style="color: red; font-size: 13px; margin-top: 4px;"></p>
        </div>

        <div class="form-group">
            <label for="role">Vai trò:</label>
            <select th:field="*{role}" id="role">
                <option th:each="r : ${roles}" th:value="${r}" th:text="${r}">ROLE</option>
            </select>
            <p th:if="${#fields.hasErrors('role')}" th:errors="*{role}" style="color: red; font-size: 13px; margin-top: 4px;"></p>
        </div>

        <div class="buttons">
            <button type="submit">Thêm</button>
            <a th:href="@{/admin/manage-users}"><button type="button">Huỷ</button></a>
        </div>
    </form>
</div>
<script th:src="@{/assets/js/admin/add-user.js}"></script>
<script th:src="@{/assets/js/fragments/header.js}"></script>
<div th:replace="fragments/footer :: footer-compact"></div>
</body>
</html>
