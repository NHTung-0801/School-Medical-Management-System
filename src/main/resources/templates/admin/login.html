<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cổng đăng nhập quản trị - Hệ thống Y Tế Học Đường">
    <title>Admin Login - Y Tế Học Đường</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" th:href="@{https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css}">
    <link rel="stylesheet" th:href="@{/assets/css/pages/login.css}"/>
    <link rel="stylesheet" th:href="@{/assets/css/pages/admin_login.css}"/>
<body class="admin-body">

<!-- Nút quay lại trang chủ dạng button thu gọn ở góc trên bên trái -->
<a th:href="@{/}" class="floating-back-btn" title="Quay lại trang chủ" aria-label="Quay lại trang chủ">
    <i class="fas fa-arrow-left"></i>
    <span>Trang chủ</span>
</a>

<div class="container admin-container">
    <!-- Left admin panel -->
    <div class="left-section admin-left">
        <div class="admin-badge">
            <i class="fas fa-user-shield"></i>
        </div>
        <h2 class="brand-title">Cổng Quản Trị</h2>
        <p class="brand-sub">Hệ thống quản lý y tế học đường<br>dành cho ban quản trị</p>
        <div class="admin-warning">
            <i class="fas fa-lock"></i>
            <span>Khu vực được bảo mật cao</span>
        </div>
    </div>

    <!-- Right form panel -->
    <div class="right-section">
        <div class="admin-label">
            <i class="fas fa-shield-alt"></i>
            <span>Admin Portal</span>
        </div>
        <h1>Đăng Nhập Quản Trị</h1>

        <div th:if="${errorMessage}" class="msg-error">
            <i class="fas fa-exclamation-triangle"></i>
            <p th:text="${errorMessage}"></p>
        </div>

        <form th:action="@{/admin/doLogin}" method="post" id="adminLoginForm">
            <input type="hidden" name="source" value="admin" />

            <!-- Username -->
            <div class="form-group">
                <label for="username">Tên đăng nhập</label>
                <div class="input-wrapper">
                    <i class="fas fa-user-cog input-icon"></i>
                    <input type="text" id="username" name="username" placeholder="admin@school.edu.vn" required autocomplete="username"/>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <div class="input-wrapper">
                    <i class="fas fa-key input-icon"></i>
                    <input type="password" id="password" name="password" placeholder="Mật khẩu quản trị" required autocomplete="current-password"/>
                    <i class="fas fa-eye toggle-password" id="togglePassword" title="Hiện/ẩn mật khẩu"></i>
                </div>
            </div>

            <div th:if="${param.error}" class="msg-error">
                <i class="fas fa-exclamation-circle"></i>
                <p>Tài khoản hoặc mật khẩu không đúng!</p>
            </div>

            <!-- Options row -->
            <div class="form-options">
                <div class="remember-me-container">
                    <input class="checkbox" type="checkbox" id="remember" name="remember" value="1">
                    <label for="remember">Nhớ tài khoản</label>
                </div>
                <div class="forgot-password">
                    <a th:href="@{/forgotpass}">Quên mật khẩu?</a>
                </div>
            </div>

            <button type="submit" class="btn-login admin-btn" id="adminLoginBtn">
                <span>Đăng Nhập</span>
                <i class="fas fa-sign-in-alt btn-icon"></i>
            </button>
        </form>
    </div>
</div>

<script th:src="@{/assets/js/login.js}"></script>
</body>
</html>
