name: CI — Build & Automated Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build, Test & Quality Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make Maven Wrapper Executable
        run: chmod +x ./mvnw

      - name: Compile & Run All Tests
        run: ./mvnw clean test -B
        env:
          SPRING_PROFILES_ACTIVE: test
          DB_PASSWORD: dummy
          SPRING_MAIL_USERNAME: ""
          SPRING_MAIL_PASSWORD: ""

      - name: Upload JaCoCo Test Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-coverage-report
          path: target/site/jacoco/
          retention-days: 14

      - name: Verify Dockerfile Build
        run: docker build -t school-medical-management:ci .
